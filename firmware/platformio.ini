; PlatformIO do firmware Esfera (Black Pill STM32F401CE).
;
; Uso:  copie este arquivo (e main.cpp) para a pasta do projeto PlatformIO,
;       ou abra esta pasta "firmware/" como projeto. Gravação e monitor:
;           pio run -t upload && pio device monitor
;
; UPLOAD — duas opções:
;   stlink (padrão, usado pela equipe): gravador ST-Link ligado por USB ao PC
;     e por 4 fios ao Black Pill (3V3, SWDIO, SWCLK, GND). Se o OpenOCD
;     reclamar "open failed": driver do ST-Link (instale o STM32CubeProgrammer
;     ou o STSW-LINK009) ou WinUSB via Zadig; confira também se nenhum outro
;     programa está segurando o gravador.
;   dfu (sem gravador nenhum): troque upload_protocol para "dfu". Para entrar
;     no bootloader: segure BOOT0, toque em RST, solte BOOT0 — depois suba o
;     upload e toque em RST de novo para rodar o programa. No Windows pode
;     precisar do driver WinUSB (Zadig) para o dispositivo "STM32 BOOTLOADER".
;
; As flags de build são ESSENCIAIS para o firmware v2:
;   - USB CDC: "Serial" passa a ser a porta COM virtual pela USB — é o link
;     com o PC (twin/wizard --serial) e com a Raspberry Pi (app de visão);
;   - ENABLE_HWSERIAL2: habilita a Serial2 em PA2/PA3 (link alternativo);
;   - AS5600: a mesma biblioteca incluída pelo main.cpp (encoder da polia).

[platformio]
build_dir = C:/tmp/pio_build_esfera
src_dir = .

[env:blackpill_f401ce]
platform = ststm32
board = blackpill_f401ce
src_filter = +<main.cpp>
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D USB_MANUFACTURER="\"WeAct\""
    -D USB_PRODUCT="\"BlackPill F401CE\""
    -D HAL_PCD_MODULE_ENABLED
    -D ENABLE_HWSERIAL2
    ; ESSENCIAL: a newlib-nano vem com printf de float DESLIGADO — sem esta
    ; flag, todo %f da telemetria (TEL,...) sai VAZIO e o twin não parseia.
    -Wl,-u,_printf_float
lib_deps = robtillaart/AS5600@^0.6.7
